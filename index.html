    <!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#526cf0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="manifest" href="manifest.webmanifest">

<title>BipolarChat</title>

<link rel="icon" href="https://s6.uupload.ir/files/file_000000002dd082469339a22756c5ad8b_e58i.png">

<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="auth" class="auth">

  <div class="auth-card">

    <img
      class="auth-logo"
      src="https://s6.uupload.ir/files/file_000000002dd082469339a22756c5ad8b_e58i.png"
    >

    <h1>BipolarChat</h1>

    <p class="auth-subtitle">
      پیام‌رسان سریع و خصوصی
    </p>

    <div id="authMessage" class="hint">
      برای شروع وارد شوید یا حساب بسازید.
    </div>

    <input id="email" type="email" placeholder="ایمیل">

    <input id="password" type="password" placeholder="رمز عبور">

    <input
      id="displayName"
      class="signup-only"
      placeholder="نام نمایشی"
    >

    <div class="auth-actions">

      <button id="loginBtn" class="primary">
        ورود
      </button>

      <button id="signupBtn" class="secondary">
        ساخت حساب
      </button>

    </div>

    <button id="forgot" class="link">
      بازیابی رمز عبور
    </button>

  </div>

</div>


<div id="app" class="app hidden">

  <aside class="sidebar">

    <header class="side-header">

      <div class="brand">

        <img
          src="https://s6.uupload.ir/files/file_000000002dd082469339a22756c5ad8b_e58i.png"
          class="brand-logo"
        >

        <div>
          <b>BipolarChat</b>
          <small>پیام‌رسان</small>
        </div>

      </div>

      <button id="menuBtn" class="round-btn">
        ☰
      </button>

    </header>


    <div class="search-box">

      <span>⌕</span>

      <input
        id="search"
        placeholder="جستجو"
      >

    </div>


    <div class="tabs">

      <button class="tab active" data-filter="all">
        همه
        <i id="allCount"></i>
      </button>

      <button class="tab" data-filter="unread">
        خوانده‌نشده
      </button>

    </div>


    <div id="chatList" class="chat-list"></div>


    <div class="side-bottom">

      <button id="newChat" class="new-chat">
        <span>＋</span>
        گفتگوی جدید
      </button>

      <button id="profileBtn" class="profile-button">
        👤
        <span>پروفایل من</span>
      </button>

    </div>

  </aside>


  <main class="main">

    <header class="chat-header">

      <button id="back" class="back-btn">
        ‹
      </button>

      <div id="avatar" class="avatar">
        B
      </div>

      <div class="chat-person">

        <b id="name">
          BipolarChat
        </b>

        <small id="status">
          یک گفتگو را انتخاب کنید
        </small>

      </div>

      <div class="header-actions">

        <button class="header-btn">
          🔎
        </button>

        <button class="header-btn">
          ⋮
        </button>

      </div>

    </header>


    <section id="messages" class="messages">

      <div class="welcome">

        <img
          src="https://s6.uupload.ir/files/file_000000002dd082469339a22756c5ad8b_e58i.png"
          class="welcome-logo"
        >

        <h2>
          BipolarChat
        </h2>

        <p>
          یک گفتگوی خصوصی را انتخاب کنید.
        </p>

      </div>

    </section>


    <form id="composer" class="composer">

      <button
        type="button"
        id="fileBtn"
        class="attach-btn"
      >
        ＋
      </button>

      <input
        id="text"
        placeholder="پیام بنویسید..."
        autocomplete="off"
      >

      <button class="send-btn">
        ➤
      </button>

      <input
        id="file"
        type="file"
        hidden
      >

    </form>

  </main>

</div>


<div id="modal" class="modal hidden">

  <div class="modal-card">

    <button id="close" class="close">
      ×
    </button>

    <h3 id="modalTitle"></h3>

    <div id="modalBody"></div>

  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>

</body>
</html>
