<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#3390ec">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="https://s6.uupload.ir/files/file_000000002dd082469339a22756c5ad8b_ko8m.png">

  <link rel="stylesheet" href="style.css">

  <title>BipolarChat</title>
</head>

<body>

<div id="toast" class="toast"></div>

<!-- ================= AUTH ================= -->

<section id="auth" class="auth-screen">

  <div class="auth-card">

    <img
      class="auth-logo"
      src="https://s6.uupload.ir/files/file_000000002dd082469339a22756c5ad8b_ko8m.png"
      alt="BipolarChat">

    <h1>BipolarChat</h1>

    <p id="authSubtitle">
      پیام‌رسان سریع و خصوصی
    </p>

    <div id="authMessage" class="auth-message">
      برای شروع وارد شوید یا حساب بسازید.
    </div>

    <label class="input-label">ایمیل</label>
    <input id="email" type="email" autocomplete="email" placeholder="ایمیل">

    <label class="input-label">رمز عبور</label>
    <input id="password" type="password" autocomplete="current-password" placeholder="رمز عبور">

    <div id="signupNameWrap" class="signup-only hidden">
      <label class="input-label">نام نمایشی</label>
      <input id="displayName" type="text" placeholder="نام شما">
    </div>

    <button id="loginBtn" class="primary-btn">ورود</button>
    <button id="signupBtn" class="secondary-btn">ساخت حساب</button>

    <button id="forgot" class="link-btn">
      رمز عبور را فراموش کرده‌اید؟
    </button>

  </div>

</section>


<!-- ================= APP ================= -->

<div id="app" class="app hidden">

  <!-- SIDEBAR -->

  <aside id="sidebar" class="sidebar">

    <header class="sidebar-header">

      <button id="menuBtn" class="icon-btn" aria-label="منو">
        <svg viewBox="0 0 24 24">
          <path d="M4 7h16M4 12h16M4 17h16"/>
        </svg>
      </button>

      <div id="headerProfile" class="header-profile">

        <div id="headerAvatar" class="avatar avatar-small">
          B
        </div>

        <div class="header-profile-text">
          <strong id="headerName">BipolarChat</strong>
          <span id="headerUsername">@bipolar</span>
        </div>

      </div>

      <button id="newChatBtn" class="icon-btn" aria-label="گفتگوی جدید">
        <svg viewBox="0 0 24 24">
          <path d="M12 20h9"/>
          <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/>
        </svg>
      </button>

    </header>


    <div class="search-box">

      <svg viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="7"/>
        <path d="m20 20-4-4"/>
      </svg>

      <input id="search" type="search" placeholder="جستجو">

    </div>


    <div class="chat-tabs">

      <button class="chat-tab active" data-filter="all">
        همه
        <span id="allCount">0</span>
      </button>

      <button class="chat-tab" data-filter="unread">
        خوانده‌نشده
      </button>

    </div>


    <div id="chatList" class="chat-list">

      <div class="empty-list">
        هنوز گفتگویی ندارید.
      </div>

    </div>


    <div class="sidebar-bottom">

      <button id="bottomNewChat" class="new-chat-btn">
        <span class="new-chat-circle">
          <svg viewBox="0 0 24 24">
            <path d="M12 5v14M5 12h14"/>
          </svg>
        </span>
        <span>گفتگوی جدید</span>
      </button>

    </div>

  </aside>


  <!-- MAIN -->

  <main id="main" class="main">

    <header class="chat-header">

      <button id="backBtn" class="icon-btn mobile-only" aria-label="بازگشت">
        <svg viewBox="0 0 24 24">
          <path d="m15 18-6-6 6-6"/>
        </svg>
      </button>

      <div id="chatAvatar" class="avatar">
        B
      </div>

      <div class="chat-header-info">

        <strong id="chatName">
          BipolarChat
        </strong>

        <span id="chatStatus">
          یک گفتگو را انتخاب کنید
        </span>

      </div>

      <div class="chat-header-actions">

        <button id="chatSearchBtn" class="icon-btn">
          <svg viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="7"/>
            <path d="m20 20-4-4"/>
          </svg>
        </button>

        <button id="chatMoreBtn" class="icon-btn">
          <svg viewBox="0 0 24 24">
            <circle cx="5" cy="12" r="1"/>
            <circle cx="12" cy="12" r="1"/>
            <circle cx="19" cy="12" r="1"/>
          </svg>
        </button>

      </div>

    </header>


    <section id="messages" class="messages">

      <div class="welcome">

        <img
          src="https://s6.uupload.ir/files/file_000000002dd082469339a22756c5ad8b_ko8m.png"
          alt=""
          class="welcome-logo">

        <h2>BipolarChat</h2>

        <p>
          یک گفتگو را انتخاب کنید.
        </p>

      </div>

    </section>


    <form id="composer" class="composer">

      <button id="attachBtn" type="button" class="composer-btn">
        <svg viewBox="0 0 24 24">
          <path d="M12 5v14M5 12h14"/>
        </svg>
      </button>

      <input
        id="text"
        type="text"
        autocomplete="off"
        placeholder="پیام بنویسید...">

      <button id="sendBtn" type="submit" class="send-btn">
        <svg viewBox="0 0 24 24">
          <path d="m4 4 16 8-16 8 3-8Z"/>
          <path d="M7 12h13"/>
        </svg>
      </button>

      <input id="file" type="file" hidden>

    </form>

  </main>

</div>


<!-- ================= MENU ================= -->

<div id="menuPanel" class="overlay hidden">

  <div class="side-panel">

    <div class="panel-header">

      <button id="closeMenu" class="back-btn">
        <svg viewBox="0 0 24 24">
          <path d="m15 18-6-6 6-6"/>
        </svg>
      </button>

      <strong>تنظیمات</strong>

    </div>


    <div class="settings-profile-card" id="settingsProfileBtn">

      <div id="settingsAvatar" class="avatar avatar-large">
        B
      </div>

      <div>
        <strong id="settingsName">کاربر</strong>
        <span id="settingsUsername">@bipolar</span>
      </div>

      <svg class="chevron" viewBox="0 0 24 24">
        <path d="m9 18 6-6-6-6"/>
      </svg>

    </div>


    <div class="settings-section">

      <button class="settings-item" data-setting="account">

        <span class="settings-icon blue">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="8" r="3"/>
            <path d="M5 20c.7-3.4 2.9-5 7-5s6.3 1.6 7 5"/>
          </svg>
        </span>

        <span>
          <strong>حساب</strong>
          <small>پروفایل و اطلاعات حساب</small>
        </span>

        <svg class="chevron" viewBox="0 0 24 24">
          <path d="m9 18 6-6-6-6"/>
        </svg>

      </button>


      <button class="settings-item" data-setting="chat">

        <span class="settings-icon green">
          <svg viewBox="0 0 24 24">
            <path d="M20 15a3 3 0 0 1-3 3H9l-5 3 1-6a3 3 0 0 1-1-2V7a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3Z"/>
          </svg>
        </span>

        <span>
          <strong>تنظیمات چت</strong>
          <small>ظاهر و رفتار گفتگو</small>
        </span>

        <svg class="chevron" viewBox="0 0 24 24">
          <path d="m9 18 6-6-6-6"/>
        </svg>

      </button>


      <button class="settings-item" data-setting="privacy">

        <span class="settings-icon purple">
          <svg viewBox="0 0 24 24">
            <rect x="5" y="10" width="14" height="10"
