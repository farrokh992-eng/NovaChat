<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#ffffff"
  >

  <meta
    name="description"
    content="BipolarChat - پیام‌رسان سریع و امن"
  >

  <meta
    name="mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >

  <title>BipolarChat</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div id="app">

    <!-- ==================== AUTH ==================== -->

    <section
      id="auth-screen"
      class="screen"
      aria-label="ورود به BipolarChat"
    >

      <div class="auth-card">

        <div class="brand">

          <div
            class="brand-logo"
            aria-hidden="true"
          >
            B
          </div>

          <h1>BipolarChat</h1>

          <p>
            پیام‌رسان سریع و امن
          </p>

        </div>


        <form
          id="login-form"
          autocomplete="on"
          novalidate
        >

          <div class="field">

            <label for="email">
              ایمیل
            </label>

            <input
              id="email"
              name="email"
              type="email"
              inputmode="email"
              autocomplete="email"
              autocapitalize="none"
              spellcheck="false"
              required
              placeholder="example@email.com"
            >

          </div>


          <div class="field">

            <label for="password">
              رمز عبور
            </label>

            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              minlength="6"
              required
              placeholder="رمز عبور"
            >

          </div>


          <button
            id="login-button"
            type="submit"
            class="primary-button"
          >
            ورود
          </button>


          <p
            id="auth-message"
            class="message"
            role="alert"
            aria-live="polite"
          ></p>

        </form>

      </div>

    </section>


    <!-- ==================== MAIN APP ==================== -->

    <section
      id="main-screen"
      class="screen hidden"
      aria-label="BipolarChat"
    >

      <!-- ==================== LEFT SIDEBAR ==================== -->

      <aside
        id="sidebar"
        class="sidebar"
      >

        <header class="sidebar-header">

          <button
            id="menu-button"
            class="icon-button"
            type="button"
            aria-label="باز کردن منو"
          >
            ☰
          </button>


          <div class="app-title">
            <strong>BipolarChat</strong>
          </div>


          <button
            id="new-chat-button"
            class="icon-button"
            type="button"
            aria-label="گفتگوی جدید"
          >
            ✎
          </button>

        </header>


        <div class="search-container">

          <label
            for="chat-search"
            class="sr-only"
          >
            جستجوی گفتگو
          </label>

          <input
            id="chat-search"
            type="search"
            placeholder="جستجو"
            autocomplete="off"
            spellcheck="false"
          >

        </div>


        <nav
          id="chat-list"
          class="chat-list"
          aria-label="گفتگوها"
        >

          <div class="empty-state">

            <div
              class="empty-icon"
              aria-hidden="true"
            >
              💬
            </div>

            <strong>
              هنوز گفتگویی ندارید
            </strong>

            <span>
              برای شروع یک گفتگوی جدید ایجاد کنید.
            </span>

          </div>

        </nav>

      </aside>


      <!-- ==================== CHAT ==================== -->

      <main
        id="chat-area"
        class="chat-area"
      >

        <header
          id="chat-header"
          class="chat-header"
        >

          <button
            id="back-button"
            class="icon-button mobile-only"
            type="button"
            aria-label="بازگشت"
          >
            ←
          </button>


          <div
            id="chat-avatar"
            class="chat-avatar"
            aria-hidden="true"
          >
            B
          </div>


          <div class="chat-info">

            <strong id="chat-name">
              BipolarChat
            </strong>

            <span id="chat-status">
              پیامی انتخاب نشده
            </span>

          </div>


          <div class="chat-actions">

            <button
              id="chat-search-button"
              class="icon-button"
              type="button"
              aria-label="جستجوی پیام"
            >
              🔍
            </button>


            <button
              id="chat-menu-button"
              class="icon-button"
              type="button"
              aria-label="گزینه‌های گفتگو"
            >
              ⋮
            </button>

          </div>

        </header>


        <!-- ==================== MESSAGES ==================== -->

        <div
          id="messages"
          class="messages"
          aria-live="polite"
        >

          <div class="welcome-state">

            <div
              class="welcome-logo"
              aria-hidden="true"
            >
              B
            </div>

            <h2>
              به BipolarChat خوش آمدید
            </h2>

            <p>
              یک گفتگو را انتخاب کنید یا گفتگوی جدیدی ایجاد کنید.
            </p>

          </div>

        </div>


        <!-- ==================== MESSAGE COMPOSER ==================== -->

        <form
          id="message-form"
          class="message-form"
          autocomplete="off"
        >

          <button
            id="attachment-button"
            type="button"
            class="icon-button"
            aria-label="افزودن پیوست"
            disabled
          >
            📎
          </button>


          <label
            for="message-input"
            class="sr-only"
          >
            متن پیام
          </label>


          <input
            id="message-input"
            type="text"
            placeholder="پیام..."
            maxlength="4000"
            autocomplete="off"
            spellcheck="true"
            disabled
          >


          <button
            id="send-button"
            type="submit"
            class="send-button"
            aria-label="ارسال پیام"
            disabled
          >
            ➤
          </button>

        </form>

      </main>


      <!-- ==================== DETAILS ==================== -->

      <aside
        id="details-panel"
        class="details-panel hidden"
      >

        <header class="details-header">

          <strong>
            اطلاعات
          </strong>


          <button
            id="close-details"
            class="icon-button"
            type="button"
            aria-label="بستن اطلاعات"
          >
            ×
          </button>

        </header>


        <div
          id="details-content"
          class="details-content"
        ></div>

      </aside>

    </section>


    <!-- ==================== MOBILE NAV ==================== -->

    <nav
      id="mobile-nav"
      class="mobile-nav hidden"
      aria-label="ناوبری"
    >

      <button
        type="button"
        class="mobile-nav-item active"
        data-section="chats"
      >
        <span aria-hidden="true">💬</span>
        <small>چت‌ها</small>
      </button>


      <button
        type="button"
        class="mobile-nav-item"
        data-section="contacts"
      >
        <span aria-hidden="true">👥</span>
        <small>مخاطبین</small>
      </button>


      <button
        type="button"
        class="mobile-nav-item"
        data-section="settings"
      >
        <span aria-hidden="true">⚙️</span>
        <small>تنظیمات</small>
      </button>

    </nav>


    <!-- ==================== MODAL ==================== -->

    <div
      id="modal"
      class="modal hidden"
      role="dialog"
      aria-modal="true"
      aria-hidden="true"
    >

      <div
        class="modal-backdrop"
        data-modal-close
      ></div>


      <div
        class="modal-content"
        role="document"
      >

        <button
          id="modal-close"
          type="button"
          class="modal-close"
          aria-label="بستن"
        >
          ×
        </button>


        <div id="modal-body"></div>

      </div>

    </div>


    <!-- ==================== TOAST ==================== -->

    <div
      id="toast"
      class="toast"
      role="status"
      aria-live="polite"
      aria-atomic="true"
    ></div>

  </div>


  <!-- ==================== SUPABASE ==================== -->

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>


  <!-- ==================== BIPOLARCHAT ==================== -->

  <script src="config.js"></script>
  <script src="app.js"></script>

</body>
</html>
